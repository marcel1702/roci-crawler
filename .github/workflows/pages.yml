name: Prüfen & GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Nur ein Deployment gleichzeitig; ein laufendes wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - name: Produktions-Build (Unterpfad für Project Pages)
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # Rauchtest der gebauten App im Browser: Titel, Hub, Mission, Bewegung, Fähigkeit, Service Worker, Offline-Neustart.
      - name: Browser-Rauchtest
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do curl -sf "http://localhost:4173/${REPO}/" > /dev/null && break; sleep 1; done
          node scripts/smoke.cjs "http://localhost:4173/${REPO}/" smoke-out

      - name: Screenshots des Rauchtests sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rauchtest
          path: smoke-out
          if-no-files-found: ignore
          retention-days: 7

      # Deployt wird nur ein Push auf den Default-Branch (Pull Requests und andere Branches nur prüfen).
      - id: target
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.target.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
